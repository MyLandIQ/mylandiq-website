let uploaded=0,errors=0;

window.uploadAll=async()=>{
const keys=Object.keys(CITIES);
document.getElementById('stats').style.display='flex';
document.getElementById('sTotal').textContent=keys.length;
document.getElementById('btnUpload').disabled=true;
log(`🚀 Starting upload of ${keys.length} cities...`,'info');

for(const key of keys){
const data=CITIES[key];
try{
await setDoc(doc(db,"city_intelligence",key),data);
uploaded++;
document.getElementById('sOk').textContent=uploaded;
log(`✅ ${data.city} (${key})`,'ok');
}catch(e){
errors++;
document.getElementById('sErr').textContent=errors;
log(`❌ ${key}: ${e.message}`,'err');
}
}

log('','info');
if(errors===0){
log(`🎉 ALL ${uploaded} CITIES UPLOADED SUCCESSFULLY!`,'ok');
log('You can now close this page. City intelligence is live in Firestore.','ok');
}else{
log(`⚠️ Done with ${errors} errors. Check Firebase Console.`,'warn');
}
};
